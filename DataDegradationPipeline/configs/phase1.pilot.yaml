config_version: "1.0"
project_name: micro-q-instruct-phase1-pilot

# All relative paths are resolved from this YAML file's directory.
pools:
  - name: external_training
    role: training
    catalog_path: ../data/catalogs/training.jsonl
    official_benchmark: false
    max_images: 100
  - name: external_development
    role: development
    catalog_path: ../data/catalogs/development.jsonl
    official_benchmark: false
    max_images: 100
  - name: microbench_evaluation
    role: evaluation
    catalog_path: ../data/catalogs/microbench_evaluation.jsonl
    official_benchmark: true
    max_images: 100

microbench_export:
  enabled: true
  dataset_id: jnirschl/uBench
  # Replace this placeholder with an immutable Hugging Face dataset commit SHA.
  revision: 3f2c5b590bc7a208d5b60f3527ce4c76a331aa2b
  split: test
  output_root: ../data/microbench
  catalog_path: ../data/catalogs/microbench_evaluation.jsonl
  cache_dir: ../data/cache/huggingface
  max_records: null
  # Conservative evaluation subset: unresolved and non-commercial sources are excluded.
  included_licenses: [CC-BY-4.0, CC-BY-SA-4.0, CC0]

logging:
  level: INFO
  json_log_path: ../outputs/pilot/logs/phase1.jsonl
  rotate_megabytes: 50
  backup_count: 5

generation:
  master_seed: 20260724
  # Nine variants select three applicable families and all three severity levels.
  variants_per_image: 9
  clean_control_fraction: 0.10
  mixed_degradation_fraction: 0.10
  output_root: ../outputs/pilot/generated
  recipe_manifest: ../outputs/pilot/manifests/recipes.jsonl
  generated_manifest: ../outputs/pilot/manifests/generated.jsonl
  output_format: png
  progress_interval: 100

degradations:
  - kind: sampling
    applicable_modalities: [light, fluorescence, electron]
    severity_parameters:
      weak: {factor: 1.5, anti_aliasing: true}
      medium: {factor: 2.0, anti_aliasing: true}
      strong: {factor: 4.0, anti_aliasing: false}

  - kind: quantization
    applicable_modalities: [light, fluorescence, electron]
    severity_parameters:
      weak: {bits: 6}
      medium: {bits: 4}
      strong: {bits: 3}

  - kind: poisson_gaussian
    applicable_modalities: [light, fluorescence, electron]
    severity_parameters:
      weak: {peak_photons: 80.0, read_noise_std: 0.003}
      medium: {peak_photons: 30.0, read_noise_std: 0.010}
      strong: {peak_photons: 10.0, read_noise_std: 0.025}

  - kind: defocus
    applicable_modalities: [light, fluorescence]
    severity_parameters:
      weak: {radius_fraction: 0.003}
      medium: {radius_fraction: 0.0075}
      strong: {radius_fraction: 0.015}

  - kind: motion
    applicable_modalities: [light, fluorescence, electron]
    severity_parameters:
      weak: {length_fraction: 0.005, angle_degrees: 15.0}
      medium: {length_fraction: 0.012, angle_degrees: 45.0}
      strong: {length_fraction: 0.025, angle_degrees: 75.0}

  - kind: periodic
    applicable_modalities: [light, fluorescence, electron]
    severity_parameters:
      weak:
        {cycles_per_image: 8.0, angle_degrees: 0.0, amplitude: 0.03, phase_radians: 0.0}
      medium:
        {cycles_per_image: 16.0, angle_degrees: 30.0, amplitude: 0.07, phase_radians: 0.0}
      strong:
        {cycles_per_image: 32.0, angle_degrees: 60.0, amplitude: 0.12, phase_radians: 0.0}

  - kind: jpeg
    applicable_modalities: [light, fluorescence, electron]
    severity_parameters:
      weak: {quality: 50, subsampling: 0}
      medium: {quality: 30, subsampling: 0}
      strong: {quality: 10, subsampling: 0}

  - kind: photobleaching
    applicable_modalities: [fluorescence]
    severity_parameters:
      weak: {retained_fraction: 0.80, background: 0.0}
      medium: {retained_fraction: 0.50, background: 0.0}
      strong: {retained_fraction: 0.25, background: 0.0}

  - kind: chromatic_misregistration
    applicable_modalities: [fluorescence]
    requires_multichannel: true
    severity_parameters:
      weak: {shift_fraction: 0.003, angle_degrees: 0.0}
      medium: {shift_fraction: 0.007, angle_degrees: 30.0}
      strong: {shift_fraction: 0.015, angle_degrees: 60.0}

  - kind: saturation
    applicable_modalities: [light, fluorescence, electron]
    severity_parameters:
      weak: {gain: 1.20, black_level: 0.0}
      medium: {gain: 1.60, black_level: 0.0}
      strong: {gain: 2.20, black_level: 0.0}

analysis:
  output_jsonl: ../outputs/pilot/analysis/degradation_analysis.jsonl
  output_csv: ../outputs/pilot/analysis/degradation_analysis.csv
  restored_output_jsonl: ../outputs/pilot/analysis/restored_analysis.jsonl
  restored_output_csv: ../outputs/pilot/analysis/restored_analysis.csv
  baseline_output_dir: ../outputs/pilot/baseline
  wavelet: db2
  wavelet_level: 2
  jpeg_block_size: 8

restoration:
  enabled: true
  output_root: ../outputs/pilot/restored
  manifest_path: ../outputs/pilot/manifests/restored.jsonl
  rules:
    - degradation: sampling
      algorithm: wavelet_denoise
      parameters: {wavelet: db2, method: BayesShrink, mode: soft}
    - degradation: quantization
      algorithm: wavelet_denoise
      parameters: {wavelet: db2, method: BayesShrink, mode: soft}
    - degradation: poisson_gaussian
      algorithm: local_wiener
      parameters: {window_size: 5}
    - degradation: defocus
      algorithm: wiener_deconvolution
      parameters: {balance: 0.02, clip: true}
    - degradation: motion
      algorithm: wiener_deconvolution
      parameters: {balance: 0.03, clip: true}
    - degradation: periodic
      algorithm: notch_reject
      parameters: {notch_radius_bins: 2.0}
    - degradation: jpeg
      algorithm: wavelet_denoise
      parameters: {wavelet: db2, method: BayesShrink, mode: soft}
    - degradation: photobleaching
      algorithm: gamma_clahe
      parameters: {clip_limit: 0.01}
    - degradation: chromatic_misregistration
      algorithm: channel_registration
      parameters: {upsample_factor: 20, maximum_displacement_factor: 2.0}
    - degradation: saturation
      algorithm: gamma_clahe
      parameters: {gamma: 1.2, clip_limit: 0.01}

validation:
  perceptual_hamming_threshold: 4
  minimum_images_per_modality: 20
  severity_imbalance_tolerance: 0.20
  minimum_monotonic_fraction: 0.80
  fail_on_near_duplicate: true
  license_allowlist:
    [CC-BY-4.0, CC-BY-SA-4.0, CC0, CC0-1.0, MIT, Public Domain]
  report_path: ../outputs/pilot/reports/validation.json
  overlap_report_path: ../outputs/pilot/reports/pool_overlap.json

reporting:
  output_root: ../outputs/pilot/reports
  contact_sheet_examples_per_group: 2
  figure_dpi: 180
  bootstrap_resamples: 2000
  confidence_level: 0.95
