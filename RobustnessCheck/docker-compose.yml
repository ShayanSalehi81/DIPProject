name: microq-robustness

services:
  qwen3-vl:
    image: "${VLLM_IMAGE:-vllm/vllm-openai:latest}"
    container_name: qwen3-vl-8b-instruct
    restart: unless-stopped
    ipc: host
    shm_size: "16g"

    ports:
      - "${VLLM_HOST_PORT:-8007}:8000"

    gpus:
      - driver: nvidia
        device_ids: ["${GPU_DEVICE_ID:-0}"]
        capabilities: [gpu]

    environment:
      HF_HOME: /root/.cache/huggingface
      HF_TOKEN: "${HF_TOKEN:-}"
      VLLM_MEDIA_URL_ALLOW_REDIRECTS: "0"

      HTTP_PROXY: "${HTTP_PROXY:-}"
      HTTPS_PROXY: "${HTTPS_PROXY:-}"
      NO_PROXY: "${NO_PROXY:-localhost,127.0.0.1,qwen3-vl}"
      http_proxy: "${HTTP_PROXY:-}"
      https_proxy: "${HTTPS_PROXY:-}"
      no_proxy: "${NO_PROXY:-localhost,127.0.0.1,qwen3-vl}"

    volumes:
      - "${HF_CACHE_DIR:-${HOME}/.cache/huggingface}:/root/.cache/huggingface"
      - vllm-compile-cache:/root/.cache/vllm

    command:
      - --model
      - "${MODEL_ID:-Qwen/Qwen3-VL-8B-Instruct}"
      - --served-model-name
      - "${MODEL_ID:-Qwen/Qwen3-VL-8B-Instruct}"
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --tensor-parallel-size
      - "${TENSOR_PARALLEL_SIZE:-1}"
      - --max-model-len
      - "${MAX_MODEL_LEN:-16384}"
      - --gpu-memory-utilization
      - "${GPU_MEMORY_UTILIZATION:-0.90}"
      - --dtype
      - bfloat16
      - --limit-mm-per-prompt
      - '{"image":1}'

    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 15m

  # Comparison models are opt-in so a bare `docker compose up` cannot try to
  # load every VLM onto the same GPU. Target any service explicitly to run it.
  internvl3-5:
    profiles: [comparison]
    image: "${VLLM_IMAGE:-vllm/vllm-openai:latest}"
    container_name: internvl3-5-8b-instruct
    restart: unless-stopped
    ipc: host
    shm_size: "16g"

    # All model services intentionally share the evaluation endpoint and must
    # therefore be run one at a time.
    ports:
      - "${VLLM_HOST_PORT:-8007}:8000"

    gpus:
      - driver: nvidia
        device_ids: ["${GPU_DEVICE_ID:-0}"]
        capabilities: [gpu]

    environment:
      HF_HOME: /root/.cache/huggingface
      HF_TOKEN: "${HF_TOKEN:-}"
      VLLM_MEDIA_URL_ALLOW_REDIRECTS: "0"

      HTTP_PROXY: "${HTTP_PROXY:-}"
      HTTPS_PROXY: "${HTTPS_PROXY:-}"
      NO_PROXY: "${NO_PROXY:-localhost,127.0.0.1,internvl3-5}"
      http_proxy: "${HTTP_PROXY:-}"
      https_proxy: "${HTTPS_PROXY:-}"
      no_proxy: "${NO_PROXY:-localhost,127.0.0.1,internvl3-5}"

    volumes:
      - "${HF_CACHE_DIR:-${HOME}/.cache/huggingface}:/root/.cache/huggingface"
      - vllm-compile-cache:/root/.cache/vllm

    command:
      - --model
      - "${INTERNVL_MODEL_ID:-OpenGVLab/InternVL3_5-8B-Instruct}"
      - --served-model-name
      - "${INTERNVL_MODEL_ID:-OpenGVLab/InternVL3_5-8B-Instruct}"
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --trust-remote-code
      - --tensor-parallel-size
      - "${TENSOR_PARALLEL_SIZE:-1}"
      - --max-model-len
      - "${MAX_MODEL_LEN:-16384}"
      - --gpu-memory-utilization
      - "${GPU_MEMORY_UTILIZATION:-0.90}"
      - --dtype
      - bfloat16
      - --limit-mm-per-prompt
      - '{"image":1}'

    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 15m

  gemma3:
    profiles: [comparison]
    image: "${VLLM_IMAGE:-vllm/vllm-openai:latest}"
    container_name: gemma-3-12b-it
    restart: unless-stopped
    ipc: host
    shm_size: "16g"

    ports:
      - "${VLLM_HOST_PORT:-8007}:8000"

    gpus:
      - driver: nvidia
        device_ids: ["${GPU_DEVICE_ID:-0}"]
        capabilities: [gpu]

    environment:
      HF_HOME: /root/.cache/huggingface
      HF_TOKEN: "${HF_TOKEN:-}"
      VLLM_MEDIA_URL_ALLOW_REDIRECTS: "0"

      HTTP_PROXY: "${HTTP_PROXY:-}"
      HTTPS_PROXY: "${HTTPS_PROXY:-}"
      NO_PROXY: "${NO_PROXY:-localhost,127.0.0.1,gemma3}"
      http_proxy: "${HTTP_PROXY:-}"
      https_proxy: "${HTTPS_PROXY:-}"
      no_proxy: "${NO_PROXY:-localhost,127.0.0.1,gemma3}"

    volumes:
      - "${HF_CACHE_DIR:-${HOME}/.cache/huggingface}:/root/.cache/huggingface"
      - vllm-compile-cache:/root/.cache/vllm

    command:
      - --model
      - "${GEMMA3_MODEL_ID:-google/gemma-3-12b-it}"
      - --served-model-name
      - "${GEMMA3_MODEL_ID:-google/gemma-3-12b-it}"
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --tensor-parallel-size
      - "${TENSOR_PARALLEL_SIZE:-1}"
      - --max-model-len
      - "${MAX_MODEL_LEN:-16384}"
      - --gpu-memory-utilization
      - "${GPU_MEMORY_UTILIZATION:-0.90}"
      - --dtype
      - bfloat16
      - --limit-mm-per-prompt
      - '{"image":1}'

    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 15m

  phi4-multimodal:
    profiles: [comparison]
    image: "${VLLM_IMAGE:-vllm/vllm-openai:latest}"
    container_name: phi-4-multimodal-instruct
    restart: unless-stopped
    ipc: host
    shm_size: "16g"

    ports:
      - "${VLLM_HOST_PORT:-8007}:8000"

    gpus:
      - driver: nvidia
        device_ids: ["${GPU_DEVICE_ID:-0}"]
        capabilities: [gpu]

    environment:
      HF_HOME: /root/.cache/huggingface
      HF_TOKEN: "${HF_TOKEN:-}"
      VLLM_MEDIA_URL_ALLOW_REDIRECTS: "0"

      HTTP_PROXY: "${HTTP_PROXY:-}"
      HTTPS_PROXY: "${HTTPS_PROXY:-}"
      NO_PROXY: "${NO_PROXY:-localhost,127.0.0.1,phi4-multimodal}"
      http_proxy: "${HTTP_PROXY:-}"
      https_proxy: "${HTTPS_PROXY:-}"
      no_proxy: "${NO_PROXY:-localhost,127.0.0.1,phi4-multimodal}"

    volumes:
      - "${HF_CACHE_DIR:-${HOME}/.cache/huggingface}:/root/.cache/huggingface"
      - vllm-compile-cache:/root/.cache/vllm

    command:
      - --model
      - "${PHI4_MODEL_ID:-microsoft/Phi-4-multimodal-instruct}"
      - --served-model-name
      - "${PHI4_MODEL_ID:-microsoft/Phi-4-multimodal-instruct}"
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      # Phi-4's visual components require the checkpoint's remote modeling code.
      - --trust-remote-code
      - --tensor-parallel-size
      - "${TENSOR_PARALLEL_SIZE:-1}"
      - --max-model-len
      - "${MAX_MODEL_LEN:-16384}"
      - --gpu-memory-utilization
      - "${GPU_MEMORY_UTILIZATION:-0.90}"
      - --dtype
      - bfloat16
      - --limit-mm-per-prompt
      - '{"image":1}'

    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 15m

volumes:
  vllm-compile-cache:
