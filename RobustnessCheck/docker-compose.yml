name: microq-robustness

services:
  qwen3-vl:
    image: "${VLLM_IMAGE:-vllm/vllm-openai:latest}"
    container_name: qwen3-vl-8b-instruct
    restart: unless-stopped
    ipc: host
    shm_size: "16g"

    ports:
      - "${VLLM_HOST_PORT:-8007}:8000"

    gpus:
      - driver: nvidia
        device_ids: ["${GPU_DEVICE_ID:-0}"]
        capabilities: [gpu]

    environment:
      HF_HOME: /root/.cache/huggingface
      HF_TOKEN: "${HF_TOKEN:-}"
      VLLM_MEDIA_URL_ALLOW_REDIRECTS: "0"

      HTTP_PROXY: "${HTTP_PROXY:-}"
      HTTPS_PROXY: "${HTTPS_PROXY:-}"
      NO_PROXY: "${NO_PROXY:-localhost,127.0.0.1,qwen3-vl}"
      http_proxy: "${HTTP_PROXY:-}"
      https_proxy: "${HTTPS_PROXY:-}"
      no_proxy: "${NO_PROXY:-localhost,127.0.0.1,qwen3-vl}"

    volumes:
      - "${HF_CACHE_DIR:-${HOME}/.cache/huggingface}:/root/.cache/huggingface"
      - vllm-compile-cache:/root/.cache/vllm

    command:
      - --model
      - "${MODEL_ID:-Qwen/Qwen3-VL-8B-Instruct}"
      - --served-model-name
      - "${MODEL_ID:-Qwen/Qwen3-VL-8B-Instruct}"
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --tensor-parallel-size
      - "${TENSOR_PARALLEL_SIZE:-1}"
      - --max-model-len
      - "${MAX_MODEL_LEN:-16384}"
      - --gpu-memory-utilization
      - "${GPU_MEMORY_UTILIZATION:-0.90}"
      - --dtype
      - bfloat16
      - --limit-mm-per-prompt
      - '{"image":1}'

    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 15m

volumes:
  vllm-compile-cache:

