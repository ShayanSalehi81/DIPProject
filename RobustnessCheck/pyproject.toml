[build-system]
requires = ["setuptools==75.6.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "microq-robustness"
version = "0.1.0"
description = "Paired clean/degraded/restored VLM robustness evaluation for Micro-Q-Instruct"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dynamic = ["dependencies"]

[project.scripts]
microq-prepare = "microq_robustness.cli:prepare_main"
microq-evaluate = "microq_robustness.cli:evaluate_main"
microq-analyze = "microq_robustness.cli:analyze_main"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

